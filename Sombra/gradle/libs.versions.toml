[versions]
agp = "9.2.1"
coreKtx = "1.19.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
appcompat = "1.6.1"
material = "1.10.0"
kotlin = "2.2.10"
composeBom = "2025.09.00"
splashscreen = "1.2.0"
activityCompose = "1.11.0"
hilt = "2.60.1"
ksp = "2.3.12"
hiltNavigationCompose = "1.4.0"
lifecycle = "2.11.0"
